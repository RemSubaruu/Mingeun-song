<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login Page</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
display: flex;
min-height: 100vh;
}

.left, .right {
width: 50%;
padding: 40px;
box-sizing: border-box;
}

.left {
background-color: #f5f5f5;
text-align: center;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
}

.logo {
width: 150px;
height: 150px;
background-color: #ddd;
border-radius: 50%;
margin-bottom: 20px;
}

.left h2 {
font-size: 24px;
margin-bottom: 10px;
}

.left p {
font-size: 14px;
margin-bottom: 20px;
}

.left button {
padding: 10px 20px;
font-size: 16px;
cursor: pointer;
}

.right {
display: flex;
flex-direction: column;
justify-content: center;
}

.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
}

input[type="text"],
input[type="password"] {
width: 100%;
padding: 10px;
box-sizing: border-box;
}

.remember {
display: flex;
align-items: center;
margin-bottom: 15px;
}

.remember input {
margin-right: 5px;
}

.login-btn {
padding: 10px;
font-size: 16px;
margin-bottom: 10px;
}

.forgot {
font-size: 12px;
color: #555;
margin-bottom: 20px;
}

.or {
text-align: center;
margin: 10px 0;
}

.socials {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.social-btn {
flex: 1 1 calc(50% - 10px);
padding: 10px;
border: 1px solid #ccc;
text-align: center;
cursor: pointer;
}
</style>
</head>
<body>

<div class="left">
    <div class="logo">
        <img src="preview.jpg" alt="Logo" style="width: 100%; height: 100%; border-radius: 50%;" />
      </div>
      
<h2>NEW HERE?</h2>
<p>Sign up and discover a great amount of new opportunities!</p>
<button>SIGN UP</button>
</div>

<div class="right">
<div class="form-group">
<label for="username">USERNAME:</label>
<input type="text" id="username" placeholder="example@gmail.com" />
</div>

<div class="form-group">
<label for="password">PASSWORD:</label>
<input type="password" id="password" placeholder="********" />
</div>

<div class="remember">
<input type="checkbox" id="remember" />
<label for="remember">Remember me</label>
</div>

<button class="login-btn">LOGIN</button>
<div class="forgot">Forgot your password?</div>

<div class="or">— or login with —</div>

<div class="socials">
<div class="social-btn">G Google</div>
<div class="social-btn"> Apple</div>
<div class="social-btn">f Facebook</div>
<div class="social-btn">🎵 Spotify</div>
</div>
</div>

</body>
</html>
